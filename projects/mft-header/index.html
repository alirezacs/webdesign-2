<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFT Header Project</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="../../fonts/FontAwesome/css/all.css">
</head>
<body>
    <header class="header">
        
        <!-- Right Side -->
        <div class="menu">
            
            <!-- Logo -->
            <div class="logo">
                <img src="./images/mftlogo.png" alt="">
            </div>

            <!-- Menu -->
            <div class="navigation">
                <ul>
                    <li>دپارتمان ها</li>
                    <li>مراکز</li>
                    <li>تقویم آموزشی</li>
                    <li>خدمات آموزشی</li>
                    <li>امور نمایندگی ها</li>
                    <li>روابط عمومی</li>
                </ul>
            </div>

        </div>

        <!-- Left Side -->
        <div class="controls">

            <div class="controls-search">
                <button>
                    <i class="fa fa-search"></i>
                </button>
            </div>

            <div class="controls-user">
                <button>
                    <i class="fa fa-user"></i>
                </button>
            </div>

            <div class="controls-account">
                <span>حساب کاربری</span>
                <i class="fa fa-angle-down"></i>
            </div>

        </div>

    </header>
</body>
<script src="../../fonts/FontAwesome/js/all.js"></script>
</html>
