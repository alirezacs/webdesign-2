<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR Timer</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <div class="container">
        <h2>NOIR</h2>
        <p class="subtitle">TIME IS YOURS</p>

        <div class="circle">
            <h1 id="timer">0 : 0 : 0</h1>

            <div class="labels">
                <span>MIN</span>
                <span>SEC</span>
                <span>MS</span>
            </div>
        </div>

        <div class="buttons">
            <button id="btn">▶ Start</button>
            <button id="reset">↻</button>
        </div>

        <p class="footer">FOCUS ON THE MOMENT ✦</p>
    </div>

    <script src="../script/js.js"></script>
</body>
</html>
