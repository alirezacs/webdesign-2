<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Weather</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <!-- Background -->
 <div class="background" id="background"></div>


 <!-- Main Container -->
    <div class="container">


 <!-- Header -->
 <header class="header">
    <div class="logo">
     <h2>CINEMATIC <span>WEATHER</span></h2>
     </div>

     <div class="search-box">

     <input
         type="text"
         id="cityInput"
         placeholder="Search any city...">
         <button id="searchBtn">Search</button>
     </div>
 </header>


 <!-- Main Weather Section -->
     <main class="main-content">

 <!-- Left Sidebar -->
     <aside class="sidebar">
        <h3>Weather Details</h3>

     <div class="detail">
         <span>Humidity</span>
         <span id="humidity">--%</span>
     </div>

     <div class="detail">
        <span>Wind Speed</span>
         <span id="wind">-- km/h</span>
     </div>

     <div class="detail">
         <span>Pressure</span>
         <span id="pressure">-- hPa</span>
     </div>

     <div class="detail">
         <span>Feels Like</span>
         <span id="feelsLike">--°</span>
     </div>

        </aside>


     <!-- Center Weather -->
         <section class="weather">
            <h2 id="city">Search a City</h2>
             <p id="date">Weather Today</p>
             <div class="weather-icon" id="weatherIcon">🌤</div>
             <div class="temperature" id="temperature">--°</div>
             <h3 id="description">Waiting for weather data...</h3>
     </section>


     <!-- Right Sidebar -->
        <aside class="right-panel">
        <h3>Recent Cities</h3>
        <div class="city-list" id="recentCities">
        <div class="city-card">No recent cities</div>

       </div>
    </aside>
</main>


     <!-- Forecast Section -->
       <section class="forecast">
         <h2>5 Days Forecast</h2>
          <div class="forecast-items" id="forecastItems">

     <!-- Forecast cards will be added with JavaScript -->

         </div>
      </section>


     <!-- Footer -->
        <footer class="footer">
          <p>CINEMATIC WEATHER :copyright: 2026</p>
          <p>Weather is more than numbers.</p>
    </footer>
 </div>

 <script src="./js/script.js"></script>

</body>

</html>
