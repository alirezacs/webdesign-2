
<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

    <div class="calculator">
        <div class="calculator-header">
            <span class="brand">♡</span>
            <span class="status-dot"></span>
        </div>

        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="display">0</div>
        </div>

        <div class="buttons">
            <button class="btn utility" data-action="clear">AC</button>
            <button class="btn utility" data-action="delete">⌫</button>
            <button class="btn utility" data-action="percent">%</button>
            <button class="btn operator" data-action="operator" data-value="/">÷</button>

            <button class="btn number" data-value="7">7</button>
            <button class="btn number" data-value="8">8</button>
            <button class="btn number" data-value="9">9</button>
            <button class="btn operator" data-action="operator" data-value="*">×</button>

            <button class="btn number" data-value="4">4</button>
            <button class="btn number" data-value="5">5</button>
            <button class="btn number" data-value="6">6</button>
            <button class="btn operator" data-action="operator" data-value="-">−</button>

            <button class="btn number" data-value="1">1</button>
            <button class="btn number" data-value="2">2</button>
            <button class="btn number" data-value="3">3</button>
            <button class="btn operator" data-action="operator" data-value="+">+</button>

            <button class="btn number zero" data-value="0">0</button>
            <button class="btn number" data-value=".">.</button>
            <button class="btn operator equal" data-action="equals">=</button>
        </div>

        <div class="calculator-footer">
            <span>MRN codes ♡</span>
        </div>
    </div>

</body>
<script src="./js/script.js"></script>
</html>
