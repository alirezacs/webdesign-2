<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> داشبورد آب‌وهوا</title>
  <meta name="description" content="وضعیت لحظه‌ای آب‌وهوای شهرها در یک داشبورد مینیمال">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

  <!-- آیکون‌های SVG (سبک Lucide) - با <use href="#i-..."> استفاده می‌شوند -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-temp-high" viewBox="0 0 24 24"><path d="M10 4v10.54a4 4 0 1 0 4 0V4a2 2 0 0 0-4 0Z"/><path d="M19 8V3M16.5 5.5 19 3l2.5 2.5"/></symbol>
    <symbol id="i-temp-low" viewBox="0 0 24 24"><path d="M10 4v10.54a4 4 0 1 0 4 0V4a2 2 0 0 0-4 0Z"/><path d="M19 3v5M16.5 5.5 19 8l2.5-2.5"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M16 14v6M8 14v6M12 16v6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
  </svg>

  <div class="page">

    <!-- ========== هدر: برند + جستجوی شهر ========== -->
    <header class="header">
      <a class="brand" href="#" aria-label="دریچه">

        <span class="brand__name">وضعیت آب و هوا</span>
      </a>

      <form id="form" class="search" role="search" novalidate>
        <svg class="icon search__icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="city" class="search__input" type="search" name="city"
               placeholder="نام شهر را بنویسید، مثلاً تهران"
               aria-label="نام شهر" autocomplete="off" required>
        <button class="search__btn" type="submit">جستجو</button>
      </form>
    </header>

    <!--
      وضعیت کلی برنامه با data-state روی #app کنترل می‌شود:
      ready | loading | error | empty
    -->
    <main id="app" class="app" data-state="ready">

      <!-- ========== حالت Loading ========== -->
      <div id="state-loading" class="state" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p class="state__title">در حال دریافت اطلاعات…</p>
      </div>

      <!-- ========== حالت Error ========== -->
      <div id="state-error" class="state state--error" role="alert">
        <svg class="icon state__icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <p class="state__title">شهر پیدا نشد</p>
        <p id="error-message" class="state__text">نام شهر را بررسی کنید و دوباره جستجو کنید.</p>
      </div>

      <!-- ========== حالت Empty ========== -->
      <div id="state-empty" class="state">
        <svg class="icon state__icon" aria-hidden="true"><use href="#i-search"/></svg>
        <p class="state__title">یک شهر را جستجو کنید</p>
        <p class="state__text">نام شهر را وارد کنید تا وضعیت آب‌وهوا نمایش داده شود.</p>
      </div>

      <!-- ========== محتوای اصلی ========== -->
      <div class="content">

        <!-- بخش اصلی: نام شهر، دما و گرافیک -->
        <section class="hero" aria-label="وضعیت فعلی">
          <div class="hero__info">
            <div class="city">
              <svg class="icon city__icon" aria-hidden="true"><use href="#i-pin"/></svg>
              <h1 id="city-name" class="city__name">--</h1>
            </div>

            <p class="temp" aria-label="دمای فعلی">
              <span id="temperature" class="temp__value value">--</span>
              <span class="temp__unit" dir="ltr">°C</span>
            </p>
          </div>

          <!--
            گرافیک آب‌وهوا: برای تغییر وضعیت، فقط کلاس #weather-scene را عوض کنید:
            scene--sunny | scene--cloudy | scene--rainy | scene--snowy | scene--night
          -->
          <div id="weather-scene" class="scene scene--sunny" role="img" aria-label="تصویر وضعیت آب‌وهوا">
            <div class="scene__sky">
              <div class="scene__stars" aria-hidden="true">
                <i style="--x:18%;--y:14%;--s:3px"></i><i style="--x:70%;--y:10%;--s:2px"></i>
                <i style="--x:42%;--y:24%;--s:2px"></i><i style="--x:84%;--y:30%;--s:3px"></i>
                <i style="--x:28%;--y:38%;--s:2px"></i><i style="--x:58%;--y:42%;--s:2px"></i>
                <i style="--x:12%;--y:52%;--s:2px"></i>
              </div>
              <div class="scene__sun"></div>
              <div class="scene__moon"></div>
              <div class="cloud cloud--back"></div>
              <div class="cloud cloud--front"></div>
              <div class="scene__rain" aria-hidden="true">
                <i style="--x:20%;--d:-.2s"></i><i style="--x:30%;--d:-.7s"></i><i style="--x:40%;--d:-.4s"></i>
                <i style="--x:50%;--d:-.9s"></i><i style="--x:60%;--d:-.1s"></i><i style="--x:70%;--d:-.6s"></i>
                <i style="--x:78%;--d:-.3s"></i><i style="--x:35%;--d:-.8s"></i><i style="--x:65%;--d:-.5s"></i>
              </div>
              <div class="scene__snow" aria-hidden="true">
                <i style="--x:22%;--d:-.5s;--s:6px"></i><i style="--x:34%;--d:-2.2s;--s:4px"></i><i style="--x:46%;--d:-1.1s;--s:7px"></i>
                <i style="--x:58%;--d:-3.4s;--s:5px"></i><i style="--x:68%;--d:-.2s;--s:6px"></i><i style="--x:78%;--d:-2.8s;--s:4px"></i>
                <i style="--x:28%;--d:-4s;--s:5px"></i><i style="--x:52%;--d:-1.8s;--s:4px"></i>
              </div>
            </div>
            <div class="scene__hills"></div>
          </div>
        </section>

        <!-- اطلاعات تکمیلی: یک پنل شیشه‌ای با شش مقدار -->
        <section class="metrics glass" aria-label="اطلاعات تکمیلی">

          <div class="metric">
            <svg class="icon metric__icon" aria-hidden="true"><use href="#i-droplet"/></svg>
            <div class="metric__body">
              <span class="metric__label">رطوبت</span>
              <span class="metric__line"><b id="humidity" class="value">--</b><small>%</small></span>
            </div>
          </div>

          <div class="metric">
            <svg class="icon metric__icon" aria-hidden="true"><use href="#i-wind"/></svg>
            <div class="metric__body">
              <span class="metric__label">سرعت باد</span>
              <span class="metric__line"><b id="wind-speed" class="value">--</b><small dir="ltr">km/h</small></span>
            </div>
          </div>

          <!-- data-period روی این عنصر: day | night -->
          <div class="metric" id="day-period" data-period="day">
            <span class="metric__icon metric__icon--swap" aria-hidden="true">
              <svg class="icon icon--day"><use href="#i-sun"/></svg>
              <svg class="icon icon--night"><use href="#i-moon"/></svg>
            </span>
            <div class="metric__body">
              <span class="metric__label">وضعیت</span>
              <span class="metric__line"><b id="day-status" class="value">--</b></span>
            </div>
          </div>

          <div class="metric">
            <svg class="icon metric__icon" aria-hidden="true"><use href="#i-temp-high"/></svg>
            <div class="metric__body">
              <span class="metric__label">بیشترین دما</span>
              <span class="metric__line"><b id="max-temperature" class="value">--</b><small dir="ltr">°C</small></span>
            </div>
          </div>

          <div class="metric">
            <svg class="icon metric__icon" aria-hidden="true"><use href="#i-temp-low"/></svg>
            <div class="metric__body">
              <span class="metric__label">کمترین دما</span>
              <span class="metric__line"><b id="min-temperature" class="value">--</b><small dir="ltr">°C</small></span>
            </div>
          </div>

          <div class="metric">
            <svg class="icon metric__icon" aria-hidden="true"><use href="#i-rain"/></svg>
            <div class="metric__body">
              <span class="metric__label">احتمال بارش</span>
              <span class="metric__line"><b id="rain-chance" class="value">--</b><small>%</small></span>
            </div>
          </div>

        </section>
      </div>
    </main>

    <!-- ========== فوتر ========== -->
    <footer class="footer">
      <p> پروژه آب و هوا MRN</p>
    </footer>

  </div>
</body>
<script src="./js/script.js"></script>
</html>
