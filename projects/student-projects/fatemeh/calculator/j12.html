
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./j12.css">
</head>
<body>
    <main class="main" id="main">
        <div class="hasheye" id="hasheye">

            <div class="adad" id="adad">
                <input type="text" class="input" id="input">
            </div>

            <div class="keys" id="keys">

                <button class="keypinkss" id="keypink">%</button>
                <button class="keypinkss" id="keypink">√</button>
                <button class="keypinksss" id="keypink">+M</button>
                <button class="keypinksss" id="keypink">-M</button>
                <button class="keypinksss" id="keypink">MRC</button>

                <button class="keypink" id="keypink">÷</button>
                <button class="keypink" id="keypink">9</button>
                <button class="keypink" id="keypink">8</button>
                <button class="keypink" id="keypink">7</button>
                <button class="keypinkss" id="keypink">←</button>

                <button class="keypink" id="keypink">×</button>
                <button class="keypink" id="keypink">6</button>
                <button class="keypink" id="keypink">5</button>
                <button class="keypink" id="keypink">4</button>
                <button class="keypinks" id="keypink">CE</button>

                <button class="keypink" id="keypink">-</button>
                <button class="keypink" id="keypink">3</button>
                <button class="keypink" id="keypink">2</button>
                <button class="keypink" id="keypink">1</button>
                <button class="keypinks" id="keypink">AC</button>

                <button class="keypink" id="keypink">+</button>
                <button class="keypink" id="keypink">=</button>
                <button class="keypinkss" id="keypink">.</button>
                <button class="keypink" id="keypink">00</button>
                <button class="keypink" id="keypink">0</button>

            </div>
        </div>
    </main>

    <script src="./j12.js"></script>
</body>
</html>
