<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO | Timer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>CHRONO</h1>
            <span>TIME MANAGEMENT</span>
        </header>

        <main>

            <div class="timer">
                <h2>COUNTDOWN</h2>
                <div class="circle">
                    <span id="display">00:00:00</span>
                </div>
                <div class="controls">
                    <button id="start">START</button>
                    <button id="pause">PAUSE</button>
                    <button id="reset">RESET</button>
                </div>
            </div>

            <div class="settings">
                <h3>SET YOUR TIME</h3>
                <div class="inputs">
                    <input type="number" id="hours" placeholder="HH" min="0" max="99">
                    <input type="number" id="minutes" placeholder="MM" min="0" max="59">
                    <input type="number" id="seconds" placeholder="SS" min="0" max="59">
                </div>
                <button id="setTime">SET TIMER</button>
            </div>

        </main>

    </div>

    <script src="script/script.js"></script>
</body>
</html>
</body>
</html>
