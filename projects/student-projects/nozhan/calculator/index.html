<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgundy Calculator</title>
     <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <div class="calculator">

        <h2 class="title">CALCULATOR</h2>

        <div class="screen" id="screen">0</div>

        <div class="buttons">

            <button class="clear" data-value="AC">AC</button>
            <button class="clear" data-value="DEL">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-value="0" class="zero">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-value="=">=</button>

        </div>

        <p class="footer">BURGUNDY EDITION</p>

    </div>

    <script src="script/script.js"></script>
</body>
</html>
