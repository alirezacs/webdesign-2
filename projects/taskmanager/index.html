
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <h2>TaskFlow</h2>

      <nav>
        <a href="#" class="active" data-filter="all">📋 All Tasks</a>
        <a href="#" data-filter="active">⏳ Active</a>
        <a href="#" data-filter="completed">✅ Completed</a>
      </nav>

      <div class="sidebar-footer">
        <p>Stay productive!</p>
      </div>
    </aside>

    <main class="main">

      <header class="header">
        <div>
          <h1>My Tasks</h1>
          <p>Manage your daily activities</p>
        </div>

        <button id="addTaskBtn">+ Add Task</button>
      </header>

      <section class="stats">
        <div class="stat-card">
          <span>Total Tasks</span>
          <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
          <span>Active Tasks</span>
          <h2 id="activeTasks">0</h2>
        </div>

        <div class="stat-card">
          <span>Completed</span>
          <h2 id="completedTasks">0</h2>
        </div>
      </section>

      <section class="task-section">

        <div class="task-toolbar">
          <input
            type="search"
            id="searchInput"
            placeholder="Search tasks..."
          >

          <select id="filterPriority">
            <option value="all">All Priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <div id="taskList" class="task-list">
            
        </div>

      </section>

    </main>

  </div>

  <!-- Create Task Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2 id="modalTitle">Add New Task</h2>
        <button id="closeModal">&times;</button>
      </div>

      <form id="taskForm">

        <input type="hidden" id="taskId">

        <label>Task Title</label>
        <input type="text" id="taskTitle"
          placeholder="Enter task title" required>

        <label>Description</label>
        <textarea id="taskDescription"
          placeholder="Task description"></textarea>

        <label>Priority</label>
        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <label>Due Date</label>
        <input type="date" id="taskDate">

        <div class="modal-actions">
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit">Save Task</button>
        </div>

      </form>

    </div>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal" id="editTaskModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2 id="modalTitle">Add New Task</h2>
        <button id="closeEditModal">&times;</button>
      </div>

      <form id="editTaskForm">

        <input type="hidden" id="editTaskId">

        <label>Task Title</label>
        <input type="text" id="editTaskTitle"
          placeholder="Enter task title" required>

        <label>Description</label>
        <textarea id="editTaskDescription"
          placeholder="Task description"></textarea>

        <label>Priority</label>
        <select id="editTaskPriority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <label>Due Date</label>
        <input type="date" id="editTaskDate">

        <div class="modal-actions">
          <button type="button" id="editModalCancelBtn">Cancel</button>
          <button type="submit">Save Task</button>
        </div>

      </form>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.21.1/axios.js" integrity="sha512-qPnrJ5rk/2kGUxG479UCkR577qsI0OW6ZJyIdP32KAoRqs8WhHz3kxOmOPyl+y+oIxnRk8BMtMH0VBdVcKXClw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/script.js"></script>
</body>
</html>
